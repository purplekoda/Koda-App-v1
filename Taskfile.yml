version: "3"

vars:
  PORT: '{{.PORT | default "3000"}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all

  dev:
    desc: Start the development server
    cmds:
      - npx next dev --port {{.PORT}}

  build:
    desc: Create a production build
    cmds:
      - npx next build

  start:
    desc: Start the production server
    cmds:
      - npx next start --port {{.PORT}}

  lint:
    desc: Run ESLint
    cmds:
      - npx eslint .

  lint:fix:
    desc: Run ESLint with auto-fix
    cmds:
      - npx eslint . --fix

  format:
    desc: Apply Biome formatting in place
    cmds:
      - npx biome format --write .

  format:check:
    desc: Check Biome formatting without writing
    cmds:
      - npx biome format .

  test:
    desc: Run vitest in watch mode
    cmds:
      - npx vitest

  test:run:
    desc: Run vitest once
    cmds:
      - npx vitest run

  test:coverage:
    desc: Run vitest with coverage and enforce ratchet
    cmds:
      - npx vitest run --coverage
      - node scripts/coverage-ratchet.js

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf .next

  install:
    desc: Install dependencies
    cmds:
      - npm install

  check:
    desc: Run format:check, lint, tests with coverage, and build
    cmds:
      - task: format:check
      - task: lint
      - task: test:coverage
      - task: build
